<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page_title or "Initialize SmartLP" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.min.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}">
  <style>
    /* Minimal fallbacks in case Tailwind build purges wizard-only classes */
    .hidden {
      display: none !important;
    }

    .slp-alert {
      margin-bottom: 1rem;
      border-radius: 0.75rem;
      border: 1px solid;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      line-height: 1.25rem;
    }

    .slp-alert-error {
      border-color: #be123c;
      background: rgba(190, 18, 60, 0.10);
      color: #9f1239;
    }

    .slp-alert-success {
      border-color: #059669;
      background: rgba(5, 150, 105, 0.10);
      color: #047857;
    }
  </style>
</head>

<body class="min-h-screen bg-gray-50 text-gray-900">
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-2xl">
      <div class="mb-6">
        <h1 class="text-2xl font-semibold">SmartLP Setup</h1>
        <p class="text-gray-600 mt-1">Complete first-run configuration to continue.</p>
      </div>

      <div class="bg-white border border-gray-200 rounded-xl shadow-md p-6">
        <div class="flex items-center justify-between text-sm mb-6">
          <div id="stepIndicator" class="text-gray-600">
            <span data-step="1" class="font-medium text-gray-900">SIEM Setup</span>
            <span class="mx-2">→</span>
            <span data-step="2">LLM Setup</span>
            <span class="mx-2">→</span>
            <span data-step="3">Review</span>
          </div>
          <div id="statusBadge" class="px-2 py-1 rounded bg-gray-200 text-gray-700">Not initialized</div>
        </div>

        <div id="alert" class="hidden slp-alert slp-alert-error"></div>
        <div id="success" class="hidden slp-alert slp-alert-success"></div>

        <!-- Step 1: SIEM -->
        <section data-step-panel="1">
          <div class="mb-4">
            <label class="block text-sm text-gray-700 mb-2">Active SIEM</label>
            <select id="siemType" class="w-full bg-white border border-gray-300 rounded px-3 py-2">
              <option value="">Select…</option>
              <option value="elastic">Elastic</option>
              <option value="splunk">Splunk</option>
            </select>
          </div>

          <div id="elasticFields" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm text-gray-700 mb-1">Elasticsearch Host</label>
                <input id="elasticHost" class="w-full bg-white border border-gray-300 rounded px-3 py-2"
                  placeholder="https://localhost:9200" />
              </div>
              <div>
                <label class="block text-sm text-gray-700 mb-1">API Key</label>
                <input id="elasticApiKey" class="w-full bg-white border border-gray-300 rounded px-3 py-2"
                  placeholder="Base64 API key" required />
              </div>
              <div class="md:col-span-2">
                <label class="block text-sm text-gray-700 mb-1">Kibana URL</label>
                <input id="elasticKibanaUrl" class="w-full bg-white border border-gray-300 rounded px-3 py-2"
                  placeholder="https://localhost:5601" required />
              </div>
              <div>
                <label class="block text-sm text-gray-700 mb-1">User</label>
                <input id="elasticUser" class="w-full bg-white border border-gray-300 rounded px-3 py-2" />
              </div>
              <div>
                <label class="block text-sm text-gray-700 mb-1">Password</label>
                <input id="elasticPassword" type="password"
                  class="w-full bg-white border border-gray-300 rounded px-3 py-2" />
              </div>
              <div>
                <label class="block text-sm text-gray-700 mb-1">Search Index</label>
                <input id="elasticSearchIndex" class="w-full bg-white border border-gray-300 rounded px-3 py-2" />
              </div>
              <div class="md:col-span-2">
                <label class="block text-sm text-gray-700 mb-1">Search Query</label>
                <input id="elasticSearchQuery" class="w-full bg-white border border-gray-300 rounded px-3 py-2"
                  placeholder='{"query": {"match_all": {}}' />
              </div>
              <div class="md:col-span-2">
                <label class="block text-sm text-gray-700 mb-1">Cert Path (Optional)</label>
                <input id="elasticCertPath" class="w-full bg-white border border-gray-300 rounded px-3 py-2"
                  placeholder="/path/to/ca.crt" />
              </div>
            </div>
          </div>

          <div id="splunkFields" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm text-gray-700 mb-1">Host</label>
                <input id="splunkHost" class="w-full bg-white border border-gray-300 rounded px-3 py-2"
                  placeholder="localhost" />
              </div>
              <div>
                <label class="block text-sm text-gray-700 mb-1">Port</label>
                <input id="splunkPort" class="w-full bg-white border border-gray-300 rounded px-3 py-2"
                  placeholder="8089" />
              </div>
              <div>
                <label class="block text-sm text-gray-700 mb-1">User</label>
                <input id="splunkUser" class="w-full bg-white border border-gray-300 rounded px-3 py-2" />
              </div>
              <div>
                <label class="block text-sm text-gray-700 mb-1">Password</label>
                <input id="splunkPassword" type="password"
                  class="w-full bg-white border border-gray-300 rounded px-3 py-2" />
              </div>
              <div>
                <label class="block text-sm text-gray-700 mb-1">Search Index</label>
                <input id="splunkSearchIndex" class="w-full bg-white border border-gray-300 rounded px-3 py-2" />
              </div>
              <div>
                <label class="block text-sm text-gray-700 mb-1">Search Entry Count</label>
                <input id="splunkSearchEntryCount" class="w-full bg-white border border-gray-300 rounded px-3 py-2"
                  placeholder="10" />
              </div>
              <div class="md:col-span-2">
                <label class="block text-sm text-gray-700 mb-1">Search Query</label>
                <input id="splunkSearchQuery" class="w-full bg-white border border-gray-300 rounded px-3 py-2"
                  placeholder="(index=main)" />
              </div>
            </div>
          </div>

          <div class="mt-6 flex items-center justify-end gap-6">
            <button id="btnSiemTest" type="button"
              class="px-4 py-2 rounded bg-gray-100 text-gray-900 font-medium inline-flex items-center hover:bg-gray-300">Test
              Connection
              <span id="siemSpinner" class="hidden ml-2">
                <i class="fas fa-spinner fa-spin"></i>
              </span>
            </button>
            <button id="btnSiemNext" type="button" disabled
              class="px-4 py-2 rounded bg-blue-600 text-white font-medium disabled:opacity-50 hover:bg-blue-600">Next</button>
          </div>
        </section>

        <!-- Step 2: LLM -->
        <section data-step-panel="2" class="hidden">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="md:col-span-2 mb-3">
              <label class="block text-sm text-gray-700 mb-1">Provider</label>
              <select id="llmProvider" class="w-full bg-white border border-gray-300 rounded px-3 py-2">
                <option value="">Select…</option>
                <option value="vllm">vLLM</option>
                <option value="ollama">Ollama</option>
                <option value="lmstudio">LM Studio</option>
                <option value="custom">OpenAI</option>
              </select>
            </div>
            <div class="md:col-span-2 mb-3">
              <label class="block text-sm text-gray-700 mb-1">Endpoint URL</label>
              <input id="llmEndpointUrl" class="w-full bg-white border border-gray-300 rounded px-3 py-2"
                placeholder="http://localhost:8000/v1" />
            </div>
            <div class="mb-3">
              <label class="block text-sm text-gray-700 mb-1">Model Name</label>
              <input id="llmModelName" class="w-full bg-white border border-gray-300 rounded px-3 py-2"
                placeholder="Qwen3-8B" />
            </div>
            <div class="mb-3">
              <label class="block text-sm text-gray-700 mb-1">API Key (optional)</label>
              <input id="llmApiKey" class="w-full bg-white border border-gray-300 rounded px-3 py-2" />
            </div>
          </div>

          <div class="mt-6 flex items-center gap-6">
            <button id="btnLlmBack"
              class="px-4 py-2 rounded bg-gray-100 text-gray-900 font-medium hover:bg-gray-300">Back</button>
            <button id="btnLlmTest"
              class="ml-auto px-4 py-2 rounded bg-gray-100 text-gray-900 font-medium inline-flex items-center hover:bg-gray-300">Test
              LLM
              <span id="llmSpinner" class="hidden ml-2">
                <i class="fas fa-spinner fa-spin"></i>
              </span>
            </button>
            <button id="btnLlmNext" disabled
              class="px-4 py-2 rounded bg-blue-600 text-white font-medium disabled:opacity-50 hover:bg-blue-600">Next</button>
          </div>
        </section>

        <!-- Step 3: Review -->
        <section data-step-panel="3" class="hidden">
          <div class="space-y-3 text-sm">
            <div class="rounded border border-gray-200 bg-gray-50 p-3">
              <div class="text-gray-600">SIEM</div>
              <div id="reviewSiem" class="mt-1 font-medium"></div>
            </div>
            <div class="rounded border border-gray-200 bg-gray-50 p-3">
              <div class="text-gray-600">LLM</div>
              <div id="reviewLlm" class="mt-1 font-medium"></div>
            </div>
          </div>

          <div class="mt-6 flex items-center gap-3">
            <button id="btnReviewBack"
              class="px-4 py-2 rounded bg-gray-100 text-gray-900 font-medium hover:bg-gray-300">Back</button>
            <button id="btnFinish"
              class="ml-auto px-4 py-2 rounded bg-green-500 text-white font-medium hover:bg-green-600">Finish
              Setup</button>
          </div>
        </section>
      </div>

      <p class="text-xs text-gray-500 mt-4">Settings are stored in MongoDB and can be changed later in Settings.</p>
    </div>
  </div>

  <!-- Case Converter Utility -->
  <script src="{{ url_for('static', filename='js/caseConverter.js') }}"></script>
  <script type="module" src="{{ url_for('static', filename='js/initWizard.js') }}"></script>
</body>

</html>
