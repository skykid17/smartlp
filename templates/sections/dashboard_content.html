<!-- Dashboard Header -->
<div class="flex flex-col lg:flex-row lg:items-center lg:justify-between mb-6 gap-4">
    <div>
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Dashboard</h1>
        <p class="text-gray-600 dark:text-gray-400">Parse and manage log entries with intelligent pattern matching</p>
    </div>
    <div class="flex items-center space-x-4">
        <!-- Status Pill -->
        <div id="statusPill" class="px-4 py-2 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-gray-400"></span>
            <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Idle</span>
        </div>
        <!-- Config Hub Button -->
        <button onclick="window.configHub.toggle()"
            class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors duration-200 flex items-center space-x-2">
            <i class="fas fa-cogs"></i>
            <span>Config Hub</span>
        </button>
    </div>
</div>

<!-- Search & Filter Card -->
<div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm mb-6">
    <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white flex items-center">
            <i class="fas fa-search mr-2 text-blue-500"></i>
            Search & Filter
        </h2>
    </div>
    <div class="p-6">
        <!-- Search Fields -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
            <div>
                <label for="searchId" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    <i class="fas fa-tag mr-1"></i>ID Search
                </label>
                <input type="text" id="searchId"
                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white"
                    placeholder="Enter ID or comma-separated IDs...">
            </div>
            <div>
                <label for="searchLog" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    <i class="fas fa-file-alt mr-1"></i>Log Content
                </label>
                <input type="text" id="searchLog"
                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white"
                    placeholder="Search in log content...">
            </div>
            <div>
                <label for="searchRegex" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    <i class="fas fa-code mr-1"></i>Regex Pattern
                </label>
                <input type="text" id="searchRegex"
                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white"
                    placeholder="Search regex patterns...">
            </div>
            <div>
                <label for="filterStatusSelect" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                    <i class="fas fa-filter mr-1"></i>Status Filter
                </label>
                <select id="filterStatusSelect"
                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white">
                    <option value="">All Statuses</option>
                    {% for status in statuses %}
                    <option value="{{ status }}">{{ status }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-wrap items-center gap-2">
            <button id="clearSearchButton"
                class="px-4 py-2 bg-gray-300 dark:bg-gray-600 text-gray-700 dark:text-white rounded-lg hover:bg-gray-400 dark:hover:bg-gray-500 transition-colors duration-200">
                <i class="fas fa-eraser mr-2"></i>Reset
            </button>
            <button id="refreshButton"
                class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-white rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-200">
                <i class="fas fa-sync-alt mr-2"></i>Refresh
            </button>
            <div class="ml-auto flex flex-wrap gap-2">
                <button id="clearSelectionButton"
                    class="px-4 py-2 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-white rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                    disabled>
                    <i class="fas fa-times mr-2"></i>Clear Selection
                </button>
                <button id="openParserButton"
                    class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                    disabled>
                    <i class="fas fa-edit mr-2"></i>Parse
                </button>
                <button id="deleteEntriesButton"
                    class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                    disabled>
                    <i class="fas fa-trash mr-2"></i>Delete
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Pagination Controls -->
<div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm mb-6 px-6 py-4">
    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <!-- Pagination Info -->
        <div class="text-sm text-gray-600 dark:text-gray-400">
            <span id="pageInfo">Showing 0-0 of 0 entries</span>
        </div>

        <!-- Pagination Controls -->
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2">
                <label for="rowsPerPage" class="text-sm text-gray-700 dark:text-gray-300">Rows:</label>
                <select id="rowsPerPage"
                    class="px-3 py-1 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white text-sm">
                    <option value="10">10</option>
                    <option value="15" selected>15</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                </select>
            </div>

            <div class="flex items-center space-x-2">
                <button id="prevPage"
                    class="px-3 py-1 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 disabled:opacity-50 disabled:cursor-not-allowed text-sm">
                    <i class="fas fa-chevron-left mr-1"></i>Previous
                </button>
                <div id="pagination-buttons" class="flex items-center space-x-1">
                    <!-- Page buttons will be inserted here -->
                </div>
                <button id="nextPage"
                    class="px-3 py-1 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 disabled:opacity-50 disabled:cursor-not-allowed text-sm">
                    Next<i class="fas fa-chevron-right ml-1"></i>
                </button>
            </div>

            <div class="flex items-center space-x-2">
                <label for="pageInput" class="text-sm text-gray-700 dark:text-gray-300">Go to:</label>
                <input type="number" id="pageInput" min="1"
                    class="w-20 px-3 py-1 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white text-sm"
                    placeholder="Page">
                <button id="goToPage"
                    class="px-3 py-1 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors duration-200 text-sm">
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Entries Table Card -->
<div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white flex items-center">
            <i class="fas fa-table mr-2 text-blue-500"></i>
            Log Entries
        </h2>
        <span id="resultsCount" class="text-sm text-gray-600 dark:text-gray-400">0 entries</span>
    </div>

    <div class="overflow-x-auto">
        <table class="w-full">
            <thead class="bg-gray-50 dark:bg-gray-700">
                <tr>
                    <th
                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                        <i class="fas fa-tag mr-1"></i>ID
                    </th>
                    <th
                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                        <i class="fas fa-clock mr-1"></i>Timestamp
                    </th>
                    <th
                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                        <i class="fas fa-file-alt mr-1"></i>Log Content
                    </th>
                    <th
                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                        <i class="fas fa-code mr-1"></i>Parser/<i class="fas fa-box mr-1"></i>Package
                    </th>
                    <th
                        class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                        <i class="fas fa-info-circle mr-1"></i>Status
                    </th>
                    <th
                        class="px-6 py-3 text-center text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">
                        <i class="fas fa-check-square mr-1"></i>Select
                    </th>
                </tr>
            </thead>
            <tbody id="entryTableBody" class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
                <!-- Table rows will be dynamically inserted here -->
            </tbody>
        </table>
    </div>
</div>

<!-- Entry Details Modal -->
<div id="entryModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col">
        <div class="flex items-center justify-between p-6 border-b border-gray-200 dark:border-gray-700">
            <h2 class="text-2xl font-semibold text-gray-900 dark:text-white">Entry Details</h2>
            <button id="entryModalClose"
                class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-6 space-y-4">
            <!-- ID -->
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">ID</label>
                <div
                    class="relative bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-3">
                    <button
                        class="absolute top-2 right-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 copy-btn">
                        <i class="fas fa-copy"></i>
                    </button>
                    <code id="modalId" class="text-sm text-gray-900 dark:text-gray-100"></code>
                </div>
            </div>

            <!-- Timestamp -->
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Timestamp</label>
                <div
                    class="relative bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-3">
                    <button
                        class="absolute top-2 right-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 copy-btn">
                        <i class="fas fa-copy"></i>
                    </button>
                    <code id="modalTimestamp" class="text-sm text-gray-900 dark:text-gray-100"></code>
                </div>
            </div>

            <!-- Index -->
            <div>
                <label for="modalIndex"
                    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Index</label>
                <input type="text" id="modalIndex"
                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white">
            </div>

            <!-- Source Type -->
            <div>
                <label for="modalSourceType"
                    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Source Type</label>
                <input type="text" id="modalSourceType"
                    class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 dark:bg-gray-700 dark:text-white">
            </div>

            <!-- Log Type -->
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Suggested Log
                    Type</label>
                <div
                    class="relative bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-3">
                    <button
                        class="absolute top-2 right-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 copy-btn">
                        <i class="fas fa-copy"></i>
                    </button>
                    <code id="modalLogType" class="text-sm text-gray-900 dark:text-gray-100"></code>
                </div>
            </div>

            <!-- Log Content -->
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Log</label>
                <div
                    class="relative bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-3">
                    <button
                        class="absolute top-2 right-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 copy-btn">
                        <i class="fas fa-copy"></i>
                    </button>
                    <code id="modalLog"
                        class="text-sm text-gray-900 dark:text-gray-100 whitespace-pre-wrap break-words"></code>
                </div>
            </div>

            <!-- Regex -->
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Regex</label>
                <div
                    class="relative bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-3">
                    <button
                        class="absolute top-2 right-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 copy-btn">
                        <i class="fas fa-copy"></i>
                    </button>
                    <code id="modalRegex"
                        class="text-sm text-gray-900 dark:text-gray-100 whitespace-pre-wrap break-words"></code>
                </div>
            </div>

            <!-- Package Name (now a single block hyperlinked to the package URL) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Package</label>
                <div
                    class="relative bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-lg p-3">
                    <button
                        class="absolute top-2 right-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 copy-btn">
                        <i class="fas fa-copy"></i>
                    </button>
                    <a id="modalPackageUrl" href="#" target="_blank"
                        class="text-sm text-blue-600 dark:text-blue-400 underline break-words">
                        <span id="modalPackageName" class="text-sm text-gray-900 dark:text-gray-100"></span>
                    </a>
                </div>
            </div>

            <!-- Status -->
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Status</label>
                <div id="modalStatus" class="inline-block px-3 py-1 rounded-full text-sm font-semibold"></div>
            </div>
        </div>

        <div class="flex justify-end space-x-2 p-6 border-t border-gray-200 dark:border-gray-700">
            <button id="saveEntryChangesBtn"
                class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors duration-200">
                <i class="fas fa-save mr-2"></i>Save Changes
            </button>
            <button id="openParserFromModal"
                class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors duration-200">
                <i class="fas fa-edit mr-2"></i>Parse
            </button>
            <button id="deleteEntryFromModal"
                class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors duration-200">
                <i class="fas fa-trash mr-2"></i>Delete
            </button>
        </div>
    </div>
</div>
